
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Firmas | Astroterapéutica</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f2f7;
  font-family: Arial, Helvetica, sans-serif;
  color: #54205e;
}

header {
  background: #54205e;
  color: #ffffff;
  text-align: center;
  padding: 28px 20px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 24px;
}

header p {
  margin: 0;
  font-size: 14px;
}

main {
  max-width: 1150px;
  margin: 30px auto;
  padding: 0 18px;
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  gap: 22px;
}

.card {
  min-width: 0;
  background: white;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 4px 20px rgba(50,20,60,.06);
}

h2 {
  margin: 0 0 20px;
  font-size: 18px;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-size: 13px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d8cedd;
  border-radius: 6px;
  font-size: 15px;
}

button {
  background: #54205e;
  color: #ffffff;
  border: none;
  border-radius: 6px;
  padding: 12px 16px;
  cursor: pointer;
  font-size: 13px;
  margin: 5px 5px 5px 0;
}

button.secondary {
  background: #eee7f1;
  color: #54205e;
}

.preview {
  width: 100%;
  overflow-x: auto;
  padding: 20px 0;
}

.preview.mobile {
  width: 375px;
  max-width: 100%;
  border: 1px dashed #cabbd0;
  padding: 10px;
  overflow: hidden;
}

#firma {
  width: 100%;
}

#estado {
  font-size: 13px;
  line-height: 1.5;
}

.nota {
  font-size: 12px;
  line-height: 1.6;
  color: #776b7b;
}

@media (max-width: 750px) {
  main {
    display: block;
  }

  .card {
    margin-bottom: 20px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Astroterapéutica</h1>
  <p>Generador de firmas institucionales</p>
</header>

<main>

<section class="card">

  <h2>Personalizá tu firma</h2>

  <label for="nombre">Nombre y apellido</label>
  <input
    id="nombre"
    type="text"
    value="Ramiro Ovejero"
  >

  <label for="cargo">Cargo</label>
  <input
    id="cargo"
    type="text"
    value="Gerente de Operaciones"
  >

  <p class="nota">
    Modificá tu nombre y cargo.
    El logo, los colores y las redes sociales
    se mantienen iguales para todo el equipo.
  </p>

</section>

<section class="card">

  <h2>Vista previa</h2>

  <button class="secondary" onclick="vista(false)">
    Escritorio
  </button>

  <button class="secondary" onclick="vista(true)">
    Móvil
  </button>

  <div id="marco" class="preview">
    <div id="firma"></div>
  </div>

  <button onclick="copiar()">
    Copiar firma para Gmail
  </button>

  <p id="estado"></p>

  <p class="nota">
    Para instalarla: Gmail →
    Configuración → Ver todos los ajustes →
    Firma → Pegar.
  </p>

</section>

</main>

<script>

// DIRECCIÓN DE LAS IMÁGENES
const base =
"https://florencia-astro.github.io/firma-astroterapeutica/";

// COLORES
const violeta = "#54205e";
const dorado = "#D6B56F";

// REDES SOCIALES
const redes = [
  {
    imagen: "FIRMA_LINKEDIN-ASTRO.svg",
    url: "https://www.linkedin.com/school/astroterapeutica/posts/",
    nombre: "LinkedIn"
  },
  {
    imagen: "FIRMA_YOUTUBE-ASTRO.svg",
    url: "https://www.youtube.com/@PabloFloresLaymuns",
    nombre: "YouTube"
  },
  {
    imagen: "FIRMA_INSTAGRAM-ASTRO.svg",
    url: "https://www.instagram.com/pablofloresastrologo/",
    nombre: "Instagram"
  },
  {
    imagen: "FIRMA_SPOTIFY-ASTRO.svg",
    url: "https://open.spotify.com/show/4sjnjM8VzF2f6bPzpRsdKz?si=7c757805113248ff",
    nombre: "Spotify"
  }
];

// EVITAR CARACTERES PROBLEMÁTICOS
function escapar(texto) {
  return texto.replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

// CREAR FIRMA
function generarFirma() {

  const nombre = escapar(
    document.getElementById("nombre").value.trim()
  );

  const cargo = escapar(
    document.getElementById("cargo").value.trim()
  );

  const iconos = redes.map(red => `
    <td
      valign="middle"
      style="padding-left:7px"
    >
      <a
        href="${red.url.replace(/&/g,'&amp;')}"
        target="_blank"
      >
        <img
          src="${base + red.imagen}"
          alt="${red.nombre}"
          width="25"
          height="25"
          style="
            display:block;
            width:25px;
            height:25px;
            border:0;
          "
        >
      </a>
    </td>
  `).join("");

  return `
  <table
    role="presentation"
    cellpadding="0"
    cellspacing="0"
    border="0"
    width="790"
    style="
      width:790px;
      border-collapse:collapse;
      background:#ffffff;
      font-family:Arial,Helvetica,sans-serif;
    "
  >
    <tr>

      <!-- ISOTIPO IZQUIERDO -->
      <td
        width="155"
        valign="middle"
        style="
          width:155px;
          min-width:155px;
          padding:0;
          vertical-align:middle;
        "
      >
        <img
          src="${base}FIRMA_ISO-ASTRO.svg"
          alt="Astroterapéutica"
          width="155"
          style="
            display:block;
            width:155px;
            height:auto;
            border:0;
          "
        >
      </td>

      <!-- CONTENIDO DERECHO -->
      <td
        valign="middle"
        style="
          padding:12px 8px 12px 14px;
          vertical-align:middle;
        "
      >

        <table
          role="presentation"
          cellpadding="0"
          cellspacing="0"
          border="0"
          width="100%"
          style="
            width:100%;
            border-collapse:collapse;
          "
        >

          <!-- NOMBRE -->
          <tr>
            <td
              style="
                color:${violeta};
                font-size:27px;
                line-height:1.15;
                font-weight:bold;
                padding:0 0 4px;
              "
            >
              ${nombre}
            </td>
          </tr>

          <!-- CARGO -->
          <tr>
            <td
              style="
                color:${violeta};
                font-size:17px;
                line-height:1.3;
                padding:0 0 17px;
              "
            >
              ${cargo}
            </td>
          </tr>

          <!-- DIVISOR DORADO -->
          <tr>
            <td
              style="
                border-top:2px solid ${dorado};
                padding-top:13px;
              "
            >

              <!-- LOGO Y REDES -->
              <table
                role="presentation"
                cellpadding="0"
                cellspacing="0"
                border="0"
                width="100%"
                style="
                  width:100%;
                  border-collapse:collapse;
                "
              >
                <tr>

                  <!-- LOGO ASTROTERAPÉUTICA -->
                  <td
                    valign="middle"
                    style="
                      vertical-align:middle;
                      padding:0;
                    "
                  >

                    <img
                      src="${base}FIRMA_LOGO-ASTRO.svg"
                      alt="Astroterapéutica"
                      width="220"
                      style="
                        display:block;
                        width:220px;
                        max-width:220px;
                        height:auto;
                        border:0;
                      "
                    >

                    <!-- BAJADA INSTITUCIONAL -->
                    <div
                      style="
                        color:${dorado};
                        font-size:10px;
                        font-family:Arial,Helvetica,sans-serif;
                        font-weight:600;
                        line-height:1.4;
                        letter-spacing:.7px;
                        white-space:nowrap;
                        padding-top:6px;
                      "
                    >
                      ESCUELA LÍDER EN ASTROLOGÍA TERAPÉUTICA
                    </div>

                  </td>

                  <!-- ÍCONOS SOCIALES -->
                  <td
                    valign="middle"
                    align="right"
                    style="
                      vertical-align:middle;
                      text-align:right;
                      padding-left:12px;
                      white-space:nowrap;
                    "
                  >

                    <table
                      role="presentation"
                      cellpadding="0"
                      cellspacing="0"
                      border="0"
                      align="right"
                    >
                      <tr>
                        ${iconos}
                      </tr>
                    </table>

                  </td>

                </tr>
              </table>

            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
  `;
}

// ACTUALIZAR VISTA PREVIA
function actualizar() {
  document.getElementById("firma").innerHTML =
    generarFirma();
}

// VISTA ESCRITORIO / MÓVIL
function vista(movil) {

  const marco = document.getElementById("marco");
  const firma = document.getElementById("firma");

  marco.classList.toggle("mobile", movil);

  if (movil) {

    firma.style.width = "790px";
    firma.style.transform = "scale(0.42)";
    firma.style.transformOrigin = "top left";

    marco.style.height = "145px";

  } else {

    firma.style.width = "790px";
    firma.style.transform = "none";
    firma.style.transformOrigin = "";

    marco.style.height = "";

  }
}

// COPIAR FIRMA PARA GMAIL
async function copiar() {

  const html = generarFirma();
  const estado = document.getElementById("estado");

  try {

    await navigator.clipboard.write([
      new ClipboardItem({
        "text/html": new Blob(
          [html],
          {type:"text/html"}
        ),
        "text/plain": new Blob(
          [
            document.getElementById("nombre").value +
            " - " +
            document.getElementById("cargo").value
          ],
          {type:"text/plain"}
        )
      })
    ]);

    estado.textContent =
      "¡Firma copiada! Ya podés pegarla en Gmail.";

  } catch(error) {

    estado.textContent =
      "No se pudo copiar automáticamente. " +
      "Probá desde Google Chrome.";

  }
}

// CAMPOS EDITABLES
document.getElementById("nombre")
  .addEventListener("input", actualizar);

document.getElementById("cargo")
  .addEventListener("input", actualizar);

// MOSTRAR FIRMA INICIAL
actualizar();

</script>

</body>
</html>
