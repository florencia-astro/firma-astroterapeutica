
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firmas Astroterapéutica</title>
<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#f5f2f7;
  color:#54205e;
  font-family:Arial,Helvetica,sans-serif;
}

header {
  background:#54205e;
  color:white;
  text-align:center;
  padding:24px 15px;
}

header h1 { font-size:24px; margin:0 0 6px; }
header p { margin:0; font-size:14px; }

main {
  max-width:1100px;
  margin:25px auto;
  padding:0 16px;
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  gap:20px;
}

.card {
  min-width:0;
  background:white;
  border-radius:12px;
  padding:22px;
}

label {
  display:block;
  font-weight:bold;
  font-size:13px;
  margin:17px 0 7px;
}

input {
  width:100%;
  padding:11px;
  font-size:15px;
  border:1px solid #d8cedd;
  border-radius:6px;
}

button {
  border:0;
  background:#54205e;
  color:white;
  padding:12px 15px;
  border-radius:6px;
  cursor:pointer;
  margin:5px 5px 5px 0;
}

.secondary {
  background:#eee7f1;
  color:#54205e;
}

.note, #estado {
  font-size:12px;
  line-height:1.6;
  color:#716678;
}

.viewport {
  overflow:auto;
  padding:16px 0;
}

.viewport.phone {
  max-width:360px;
  border:1px dashed #cabbd0;
  padding:12px 6px;
}

#signature {
  width:100%;
  max-width:790px;
}

@media(max-width:750px) {
  main { display:block; }
  .card { margin-bottom:18px; }
}
</style>
</head>

<body>

<header>
  <h1>Astroterapéutica</h1>
  <p>Generador de firmas institucionales</p>
</header>

<main>
<section class="card">
  <h2>Personalizá tu firma</h2>

  <label for="name">Nombre y apellido</label>
  <input id="name" value="Ramiro Ovejero">

  <label for="role">Cargo</label>
  <input id="role" value="Gerente de Operaciones">

  <p class="note">
    Los logos y las redes son iguales
    para todo el equipo.
  </p>
</section>

<section class="card">
  <h2>Vista previa</h2>

  <button class="secondary" id="desktop">
    Escritorio
  </button>

  <button class="secondary" id="mobile">
    Móvil
  </button>

  <div class="viewport desktop" id="viewport">
    <div id="signature"></div>
  </div>

  <button id="copy">
    Copiar firma para Gmail
  </button>

  <p id="estado" aria-live="polite"></p>

  <p class="note">
    Gmail → Configuración →
    Ver todos los ajustes → Firma.
    Pegá allí la firma copiada.
  </p>
</section>
</main>

<script>
const base =
  'https://florencia-astro.github.io/firma-astroterapeutica/';

const social = [
  [
    'FIRMA_LINKEDIN-ASTRO.svg',
    'https://www.linkedin.com/school/astroterapeutica/posts/',
    'LinkedIn'
  ],
  [
    'FIRMA_YOUTUBE-ASTRO.svg',
    'https://www.youtube.com/@PabloFloresLaymuns',
    'YouTube'
  ],
  [
    'FIRMA_INSTAGRAM-ASTRO.svg',
    'https://www.instagram.com/pablofloresastrologo/',
    'Instagram'
  ],
  [
    'FIRMA_SPOTIFY-ASTRO.svg',
    'https://open.spotify.com/show/4sjnjM8VzF2f6bPzpRsdKz?si=7c757805113248ff',
    'Spotify'
  ]
];

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function build() {
  const name = escapeHtml(
    document.getElementById('name').value.trim()
  );

  const role = escapeHtml(
    document.getElementById('role').value.trim()
  );

  const icons = social.map(([file,url,label]) => `
    <td style="padding:0 8px 0 0">
      <a href="${url.replace(/&/g,'&amp;')}"
         target="_blank">
        <img
          src="${base+file}"
          alt="${label}"
          width="24"
          height="24"
          style="
            display:block;
            border:0;
            width:24px;
            height:24px;
          ">
      </a>
    </td>
  `).join('');

  return `
  <style>
  @media screen and (max-width:480px) {

    .astro-root {
      width:100%!important;
      max-width:360px!important;
    }

    .astro-iso-cell {
      width:none!important;
      width:0!important;
      padding:0!important;
    }

    .astro-iso {
      width:84px!important;
      height:auto!important;
    }

    .astro-content {
      padding:14px 12px!important;
    }

    .astro-name {
      font-size:17px!important;
    }

    .astro-role {
      font-size:12px!important;
      padding-bottom:9px!important;
    }

    .astro-divider {
      border-top:0!important;
      padding-top:0!important;
    }

    .astro-logo {
      width:155px!important;
      height:auto!important;
    }

    .astro-tagline {
      font-size:7px!important;
      letter-spacing:0!important;
      white-space:normal!important;
    }

    .astro-social-cell {
      display:block!important;
      width:100%!important;
      padding:9px 0 0!important;
      text-align:left!important;
    }

    .astro-social-table {
      float:none!important;
      margin-left:0!important;
    }
  }
  </style>

  <table
    class="astro-root"
    role="presentation"
    cellpadding="0"
    cellspacing="0"
    border="0"
    width="790"
    style="
      border-collapse:collapse;
      width:100%;
      max-width:790px;
      background:#ffffff;
      font-family:Arial,Helvetica,sans-serif;
    "
  >
  <tr>

    <!-- ISOTIPO IZQUIERDO -->
    <td
      class="astro-iso-cell"
      width="215"
      valign="middle"
      style="
        width:27%;
        padding:0 14px 0 0;
        vertical-align:middle;
      "
    >
      <img
        class="astro-iso"
        src="${base}FIRMA_ISO-ASTRO.svg"
        alt="Isotipo Astroterapéutica"
        width="215"
        style="
          display:block;
          width:100%;
          max-width:215px;
          height:auto;
          border:0;
        "
      >
    </td>

    <!-- CONTENIDO DERECHO -->
    <td
      class="astro-content"
      valign="middle"
      style="
        padding:14px 10px 14px 12px;
        vertical-align:middle;
      "
    >

      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="100%"
        style="
          border-collapse:collapse;
          width:100%;
        "
      >

        <!-- NOMBRE -->
        <tr>
          <td
            class="astro-name"
            style="
              color:#54205e;
              font-size:27px;
              line-height:1.18;
              font-weight:bold;
              padding:0 0 4px;
            "
          >
            ${name}
          </td>
        </tr>

        <!-- CARGO -->
        <tr>
          <td
            class="astro-role"
            style="
              color:#54205e;
              font-size:17px;
              line-height:1.3;
              padding:0 0 15px;
            "
          >
            ${role}
          </td>
        </tr>

        <!-- DIVISOR DORADO -->
        <tr>
          <td
            class="astro-divider"
            style="
              border-top:2px solid #D6B56F;
              padding-top:12px;
            "
          >

            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              border="0"
              width="100%"
              style="
                border-collapse:collapse;
                width:100%;
              "
            >
              <tr>

                <!-- LOGO Y BAJADA -->
                <td
                  valign="middle"
                  style="vertical-align:middle"
                >
                  <img
                    class="astro-logo"
                    src="${base}FIRMA_LOGO-ASTRO.svg"
                    alt="Astroterapéutica"
                    width="132"
                    style="
                      display:block;
                      width:132px;
                      max-width:100%;
                      height:auto;
                      border:0;
                    "
                  >

                  <div
                    class="astro-tagline"
                    style="
                      color:#D6B56F;
                      font-size:10px;
                      font-weight:300;
                      line-height:1.4;
                      letter-spacing:.4px;
                      padding-top:5px;
                    "
                  >
                    ESCUELA LÍDER EN ASTROLOGÍA TERAPÉUTICA
                  </div>
                </td>

                <!-- REDES SOCIALES -->
                <td
                  class="astro-social-cell"
                  align="right"
                  valign="middle"
                  style="
                    text-align:right;
                    vertical-align:middle;
                    padding-left:12px;
                  "
                >
                  <table
                    class="astro-social-table"
                    role="presentation"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    align="right"
                  >
                    <tr>${icons}</tr>
                  </table>
                </td>

              </tr>
            </table>

          </td>
        </tr>

      </table>
    </td>
  </tr>
  </table>`;
}

function render() {
  document.getElementById('signature').innerHTML =
    build();
}

document.getElementById('name')
  .addEventListener('input', render);

document.getElementById('role')
  .addEventListener('input', render);

document.getElementById('desktop').onclick = () => {
  document.getElementById('viewport').className =
    'viewport desktop';
};

document.getElementById('mobile').onclick = () => {
  document.getElementById('viewport').className =
    'viewport phone';
};

document.getElementById('copy').onclick = async () => {
  const status = document.getElementById('estado');

  try {
    if (
      !navigator.clipboard?.write ||
      typeof ClipboardItem === 'undefined'
    ) {
      throw new Error('Clipboard unavailable');
    }

    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob(
          [build()],
          {type:'text/html'}
        ),
        'text/plain': new Blob(
          [
            document.getElementById('name').value +
            ' - ' +
            document.getElementById('role').value
          ],
          {type:'text/plain'}
        )
      })
    ]);

    status.textContent =
      'Firma copiada. Pegala en Gmail.';

  } catch(error) {
    status.textContent =
      'No se pudo copiar. Probá desde Chrome ' +
      'con la página publicada en GitHub Pages.';
  }
};

render();
</script>

</body>
</html>
