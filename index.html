
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmas Astroterapéutica</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f0f6;
  font-family: Arial, sans-serif;
  color: #50245f;
}
header {
  background: #50245f;
  color: white;
  padding: 24px;
  text-align: center;
}
header h1 { margin: 0; font-size: 23px; }
header p { font-size: 14px; }
main {
  max-width: 1050px;
  margin: 30px auto;
  padding: 16px;
  display: grid;
  grid-template-columns: 270px minmax(0,1fr);
  gap: 20px;
}
.card {
  background: white;
  border-radius: 12px;
  padding: 22px;
}
label {
  display: block;
  margin: 16px 0 7px;
  font-size: 13px;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d5c8da;
  border-radius: 6px;
  font-size: 15px;
}
button {
  background: #50245f;
  color: white;
  border: 0;
  border-radius: 6px;
  padding: 12px 16px;
  cursor: pointer;
  margin: 6px 5px 6px 0;
}
.preview {
  padding: 18px 0;
  overflow-x: auto;
}
.preview.mobile {
  width: 350px;
  max-width: 100%;
  border: 1px dashed #c5b7cb;
  padding: 8px;
}
#firma { max-width: 100%; }
#estado { font-size: 13px; line-height: 1.5; }
@media(max-width:750px) {
  main { display: block; }
  .card { margin-bottom: 20px; }
}
</style>
</head>
<body>

<header>
<h1>Astroterapéutica</h1>
<p>Generador de firmas institucionales</p>
</header>

<main>
<section class="card">
<h3>Personalizá tu firma</h3>

<label for="nombre">Nombre y apellido</label>
<input id="nombre" value="Ramiro Ovejero">

<label for="cargo">Cargo</label>
<input id="cargo" value="Gerente de Operaciones">

<p style="font-size:13px;line-height:1.6">
Los logos, colores y enlaces sociales
se mantienen iguales para todo el equipo.
</p>
</section>

<section class="card">
<h3>Vista previa</h3>

<button onclick="vista(false)">Escritorio</button>
<button onclick="vista(true)">Móvil</button>

<div id="marco" class="preview">
<div id="firma"></div>
</div>

<button onclick="copiar()">Copiar firma para Gmail</button>
<p id="estado"></p>
</section>
</main>

<script>
const base =
"https://florencia-astro.github.io/firma-astroterapeutica/";

const redes = [
  ["FIRMA_LINKEDIN-ASTRO.svg",
   "https://www.linkedin.com/school/astroterapeutica/posts/"],
  ["FIRMA_YOUTUBE-ASTRO.svg",
   "https://www.youtube.com/@PabloFloresLaymuns"],
  ["FIRMA_INSTAGRAM-ASTRO.svg",
   "https://www.instagram.com/pablofloresastrologo/"],
  ["FIRMA_SPOTIFY-ASTRO.svg",
   "https://open.spotify.com/show/4sjnjM8VzF2f6bPzpRsdKz?si=7c757805113248ff"]
];

function escapar(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function crearFirma() {
  const nombre = escapar(
    document.getElementById("nombre").value
  );
  const cargo = escapar(
    document.getElementById("cargo").value
  );

  const iconos = redes.map(([archivo,enlace]) => `
    <td style="padding-right:9px">
      <a href="${enlace.replace(/&/g,'&amp;')}"
         target="_blank">
        <img src="${base+archivo}"
             width="24" height="24"
             style="display:block;border:0"
             alt="Red social">
      </a>
    </td>
  `).join("");

  return `
  <table cellpadding="0" cellspacing="0" border="0"
    role="presentation"
    style="width:100%;max-width:600px;
    font-family:Arial,sans-serif;
    background:#ffffff;border-collapse:collapse">

    <tr>
      <td width="155" valign="middle"
        style="background:#50245f;
        border-radius:0 80px 80px 0;
        text-align:center;padding:20px 12px">
        <img
          src="${base}FIRMA_ISO-ASTRO.svg"
          width="115"
          alt="Astroterapéutica"
          style="display:block;width:115px;
          max-width:100%;height:auto;border:0">
      </td>

      <td valign="middle"
        style="padding:14px 12px 14px 22px">

        <table cellpadding="0" cellspacing="0"
          border="0" role="presentation"
          style="width:100%;border-collapse:collapse">

          <tr>
            <td style="font-size:25px;
              font-weight:bold;color:#50245f;
              line-height:1.15">
              ${nombre}
            </td>
          </tr>

          <tr>
            <td style="font-size:15px;
              color:#50245f;
              padding:5px 0 14px">
              ${cargo}
            </td>
          </tr>

          <tr>
            <td style="border-top:2px solid #c6ac79;
              padding-top:12px">

              <table cellpadding="0" cellspacing="0"
                border="0" role="presentation"
                style="width:100%">
                <tr>
                  <td valign="middle">
                    <img
                      src="${base}FIRMA_LOGO-ASTRO.svg"
                      width="190"
                      alt="Astroterapéutica"
                      style="display:block;
                      width:190px;max-width:100%;
                      height:auto;border:0">
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:12px">
                    <table cellpadding="0"
                      cellspacing="0" border="0"
                      role="presentation">
                      <tr>${iconos}</tr>
                    </table>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>`;
}

function actualizar() {
  document.getElementById("firma").innerHTML =
    crearFirma();
}

function vista(movil) {
  document.getElementById("marco")
    .classList.toggle("mobile",movil);
}

async function copiar() {
  const html = crearFirma();
  const estado = document.getElementById("estado");

  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        "text/html": new Blob(
          [html],{type:"text/html"}
        ),
        "text/plain": new Blob(
          [document.getElementById("nombre").value],
          {type:"text/plain"}
        )
      })
    ]);
    estado.textContent =
      "Firma copiada. Pegala en la configuración de Gmail.";
  } catch(e) {
    estado.textContent =
      "No se pudo copiar. Usá Chrome desde GitHub Pages.";
  }
}

document.getElementById("nombre")
  .addEventListener("input",actualizar);
document.getElementById("cargo")
  .addEventListener("input",actualizar);

actualizar();
</script>
</body>
</html>
